title: "Multi-Region Azure Web Application"
page: "free"
direction: LR
layered: true
provider_default: azure

# Active/standby is drawn the way architects draw it: the ACTIVE region in full,
# the STANDBY region as its warm mirror (same stack), joined by the failover
# route and the data replication links. Drawing the standby stack twice only
# doubles the arrows without adding information.

abbreviations:
  AD: "Active Directory"
  CDN: "Content Delivery Network"
  DB: "Database"
  SQL: "Structured Query Language"

groups:
  - {id: global, label: "Global Edge"}
  - {id: active, label: "Active Region"}
  - {id: data, label: "Data Tier", parent: active}
  - {id: standby, label: "Standby Region (warm mirror)"}

nodes:
  - {id: user, label: "Users", icon_key: generic.user}
  - {id: ad, label: "Azure AD", icon_key: azure.ad-b2c, group: global}
  - {id: fd, label: "Front Door", icon_key: azure.front-door-and-cdn-profiles, group: global}
  - {id: cdn, label: "Azure CDN", icon_key: azure.cdn-profiles, group: global}
  - {id: blob, label: "Blob Storage", icon_key: azure.storage-accounts, group: global}

  - {id: web1, label: "Web App", icon_key: azure.app-services, group: active}
  - {id: queue1, label: "Azure Queue", icon_key: azure.storage-queue, group: active}
  - {id: func1, label: "Function App", icon_key: azure.function-apps, group: active}
  - {id: redis1, label: "Redis Cache", icon_key: azure.cache-redis, group: data}
  - {id: sql1, label: "SQL Database", icon_key: azure.sql-database, group: data}
  - {id: cosmos1, label: "Cosmos DB", icon_key: azure.cosmos-db, group: data}

  - {id: web2, label: "Web App", icon_key: azure.app-services, group: standby}
  - {id: sql2, label: "SQL Replica", icon_key: azure.sql-database, group: standby}
  - {id: cosmos2, label: "Cosmos Replica", icon_key: azure.cosmos-db, group: standby}

edges:
  - {src: user, dst: fd, label: "HTTPS"}
  - {src: user, dst: cdn, label: "Static"}
  - {src: cdn, dst: blob, label: "Origin"}
  - {src: user, dst: ad, label: "Sign-in", style: dashed}

  - {src: fd, dst: web1, label: "Route"}
  - {src: fd, dst: web2, label: "Failover", style: dotted}

  - {src: web1, dst: queue1, label: "Enqueue"}
  - {src: queue1, dst: func1, label: "Trigger"}
  - {src: web1, dst: redis1, label: "Cache"}
  - {src: func1, dst: sql1, label: "R/W"}
  - {src: func1, dst: cosmos1, label: "R/W"}

  - {src: sql1, dst: sql2, label: "Geo-replicate", style: dotted}
  - {src: cosmos1, dst: cosmos2, label: "Replicate", style: dotted}
