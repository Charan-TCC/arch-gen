title: "Distributed Load Testing Platform"
page: "16:9"
direction: LR
layered: true
abbreviations:
  API: "Application Programming Interface"
  AWS: "Amazon Web Services"
  S3: "Simple Storage Service"
  VPC: "Virtual Private Cloud"
  ECR: "Elastic Container Registry"
  ECS: "Elastic Container Service"
  IoT: "Internet of Things"
  IAM: "Identity and Access Management"

groups:
  - {id: frontend, label: "Frontend", provider: aws}
  - {id: backend, label: "Backend (Load Testing)", provider: aws}
  - {id: ecr_repo, label: "Container Repository", provider: aws}
  - {id: regional, label: "Regional Resources", provider: aws}
  - {id: vpc, label: "Secure VPC", parent: regional, kind: subnet}
  - {id: ops, label: "Ops & Monitoring", provider: aws}

nodes:
  - {id: amplify, icon_key: aws.amplify, label: "AWS Amplify", group: frontend}
  - {id: s3_web, icon_key: aws.s3, label: "Amazon S3", group: frontend}
  - {id: cloudfront, icon_key: aws.cloudfront, label: "Amazon CloudFront", group: frontend}
  - {id: cognito, icon_key: aws.cognito, label: "Amazon Cognito", group: frontend}
  
  - {id: api, icon_key: aws.api-gateway, label: "Amazon API Gateway"}
  - {id: iam, icon_key: aws.identity-and-access-management, label: "AWS IAM"}

  - {id: runner, icon_key: aws.lambda, label: "Task Runner (Lambda)", group: backend}
  - {id: ddb, icon_key: aws.dynamodb, label: "Amazon DynamoDB", group: backend}
  - {id: s3_assets, icon_key: aws.s3, label: "Amazon S3", group: backend}
  
  - {id: ecr, icon_key: aws.elastic-container-registry, label: "Amazon ECR", group: ecr_repo}
  
  - {id: ecs, icon_key: aws.elastic-container-service, label: "Amazon ECS", group: vpc}
  - {id: fargate, icon_key: aws.fargate, label: "AWS Fargate", group: vpc}
  
  - {id: cloudwatch, icon_key: aws.cloudwatch, label: "Amazon CloudWatch", group: ops}
  - {id: automation, icon_key: aws.lambda, label: "Automation (Lambda)", group: ops}
  - {id: iot, icon_key: aws.iot-core, label: "AWS IoT Core", group: ops}
  
edges:
  - {src: amplify, dst: s3_web, style: dashed}
  - {src: s3_web, dst: cloudfront}
  - {src: cloudfront, dst: cognito, label: "Auth"}
  - {src: cognito, dst: iam, style: dashed}
  
  - {src: cloudfront, dst: api}
  - {src: api, dst: runner}
  
  - {src: runner, dst: ddb, label: "Config"}
  - {src: runner, dst: s3_assets, label: "Assets"}
  - {src: runner, dst: ecs, label: "Orchestrate"}
  
  - {src: ecs, dst: ecr, label: "Pull Image"}
  - {src: ecs, dst: fargate, label: "Launch"}
  
  - {src: fargate, dst: cloudwatch, label: "Logs"}
  - {src: fargate, dst: iot, label: "Status"}
  - {src: iot, dst: runner}
  
  - {src: cloudwatch, dst: automation}
  - {src: automation, dst: runner, style: dashed}
